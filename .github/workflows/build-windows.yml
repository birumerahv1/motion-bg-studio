name: build-windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        shell: pwsh
        run: |
          ruff check src

      - name: Build .exe with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm packaging/motion-bg-studio.spec

      - name: Download bundled ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/2024-09-26-git-f43916e217/ffmpeg-2024-09-26-git-f43916e217-essentials_build.zip"
          $tmp = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $tmp
          Expand-Archive -Path $tmp -DestinationPath "$env:RUNNER_TEMP\ffmpeg-extract" -Force
          $ffmpeg = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg-extract" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName -Destination "dist\motion-bg-studio\ffmpeg.exe" -Force
          Get-ChildItem "dist\motion-bg-studio" | Select-Object -First 10

      - name: Smoke test (run --version via CLI script)
        shell: pwsh
        run: |
          # Sanity check: launch the GUI binary briefly to ensure it starts.
          $exe = "dist\motion-bg-studio\motion-bg-studio.exe"
          if (-not (Test-Path $exe)) { throw "exe not produced" }
          Write-Host "Built executable size:" (Get-Item $exe).Length

      - name: Upload artifact (folder contents, no extra zip wrapper)
        uses: actions/upload-artifact@v4
        with:
          name: motion-bg-studio-windows-x64
          path: dist/motion-bg-studio/
          if-no-files-found: error

      - name: Package zip for GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Replace('/', '-')
          $zip = "motion-bg-studio-windows-x64-$version.zip"
          Compress-Archive -Path dist\motion-bg-studio\* -DestinationPath $zip
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Attach to GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
